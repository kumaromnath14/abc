# Browser Configuration
browser=chrome
headless.mode=false

# URL Configuration
base.url=https://www.ajio.com/

# Timeout Configuration (in seconds)
implicit.wait=10
explicit.wait=20
pageload.timeout=30

# Test Environment
test.env=qa

# Screenshot Configuration
screenshot.path=target/screenshots/
take.screenshot.on.failure=true

# Test Data
test.data.path=src/test/resources/testdata/

# Retry Configuration
max.retry.count=2

# Browser Specific Options
chrome.options=--start-maximized,--disable-notifications
firefox.options=-private
